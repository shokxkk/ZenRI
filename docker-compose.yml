services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: zenri_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zenri_dev
    ports:
      - "5432:5432"
    volumes:
      - zenri_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zenri_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: zenri_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zenri_test
    ports:
      - "5433:5432"
    volumes:
      - zenri_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zenri_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zenri_dev_data:
  zenri_test_data:
